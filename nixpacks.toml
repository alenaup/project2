[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.fileinfo", "php82Extensions.openssl", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd", "php82Extensions.sodium", "php82Extensions.intl", "php82Extensions.bcmath", "composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-dev --ignore-platform-req=ext-gd --ignore-platform-req=ext-sodium",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan view:cache"
]

[start]
cmd = "mkdir -p storage/app/livewire-tmp storage/framework/cache storage/framework/sessions storage/framework/views storage/logs && rm -rf public/storage && php -c /app/php.ini artisan storage:link && php -c /app/php.ini artisan config:cache && php -c /app/php.ini artisan route:cache && php -c /app/php.ini artisan serve --host=0.0.0.0 --port=$PORT"
